version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"

    cooldown:

      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"

    cooldown:

      default-days: 7
    directories:
      - "/modules/**"
      - "/examples/*"
    schedule:
      interval: "weekly"
    groups:
      terraform:
        patterns: ["*"]
    open-pull-requests-limit: 5
